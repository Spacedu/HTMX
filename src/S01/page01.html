<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- HTTP Method/Verb: GET, POST, PUT, DELETE... -->

    <!-- hx-swap: innerHTML, outerHTML, beforebegin(before div), afterend(after div), afterbegin(first child), beforeend(last child) -->

    <button hx-get="data.html" hx-target="#data" hx-swap="afterbegin">Load data!</button>

    <div id="data">
        place
    </div>

    <!-- Install HTMX - CDN(cache) -->
    <script src="https://unpkg.com/htmx.org@2.0.8/dist/htmx.min.js"></script>
</body>
</html>
